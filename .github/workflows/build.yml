name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft-version }} / build JDK ${{ matrix.build-java-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft-version: "1.18"
            build-java-version: "21"
          - minecraft-version: "1.21.1"
            build-java-version: "21"
          - minecraft-version: "26.2"
            build-java-version: "25"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.build-java-version }}
          distribution: "temurin"
          cache: "gradle"

      - name: Build and validate
        run: ./gradlew clean build -Pminecraft_version=${{ matrix.minecraft-version }}

      - name: Set up Java 17 runtime
        if: matrix.minecraft-version == '1.18'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Scala CLI
        if: matrix.minecraft-version == '1.18'
        uses: coursier/setup-action@v3
        with:
          apps: scala-cli:1.12.4

      - name: Smoke test the bundled Scala runtime on Java 17
        if: matrix.minecraft-version == '1.18'
        shell: bash
        run: |
          set -euo pipefail
          test "$(java -XshowSettings:properties -version 2>&1 | awk -F= '/java.specification.version/ { gsub(/ /, "", $2); print $2 }')" = "17"
          distribution_jar=$(find build/libs -maxdepth 1 -type f -name 'krysztal-language-scala-*.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$distribution_jar"
          mkdir -p "$RUNNER_TEMP/kls-runtime"
          unzip -p "$distribution_jar" META-INF/jars/scala-library-3.8.4.jar > "$RUNNER_TEMP/kls-runtime/scala-library.jar"
          unzip -p "$distribution_jar" META-INF/jars/scala3-library_3-3.8.4.jar > "$RUNNER_TEMP/kls-runtime/scala3-library.jar"

          runtime_classpath="$RUNNER_TEMP/kls-runtime/scala-library.jar:$RUNNER_TEMP/kls-runtime/scala3-library.jar"
          java -cp "build/classes/scala/test:$runtime_classpath" net.fabricmc.language.scala.RuntimeCompatibilityFixture

          cat > "$RUNNER_TEMP/OlderRuntimeFixture.scala" <<'EOF'
          object OlderRuntimeFixture:
            def main(args: Array[String]): Unit =
              val result = List(1, 2, 3).map(_ + 1).sum
              if result != 9 then throw new IllegalStateException(s"Unexpected result: $result")
          EOF

          for compiler_version in 3.3.8 3.7.4 3.8.4; do
            classes="$RUNNER_TEMP/classes-$compiler_version"
            scala-cli compile "$RUNNER_TEMP/OlderRuntimeFixture.scala" \
              --scala "$compiler_version" --jvm system --server=false -d "$classes"
            java -cp "$classes:$runtime_classpath" OlderRuntimeFixture
          done
