import java.lang.System

plugins {
	id "me.modmuss50.mod-publish-plugin" version "1.1.0"
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'java-library'
	id 'scala'
	id "com.diffplug.spotless" version "7.0.4"
	id 'groovy'
}

base {
	archivesName = project.archives_base_name
}

def detected_scala_version = System.getenv("SCALA3_VERSION")==null ? project.scala_version: System.getenv("SCALA3_VERSION")
def scala_standard_library_version = detected_scala_version.tokenize('.')[1].toInteger() >= 8 ? detected_scala_version : "2.13.12"
version = mod_version + "+scala." + detected_scala_version

System.out.println("Building with Scala3: ${detected_scala_version}")

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	compileOnly 'org.projectlombok:lombok:1.18.46'
	annotationProcessor 'org.projectlombok:lombok:1.18.46'

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	include(api("org.scala-lang:scala3-library_3:${detected_scala_version}"))
	include(api("org.scala-lang:scala-library:${scala_standard_library_version}"))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

spotless {
	groovy {
		greclipse()
	}

	groovyGradle {
		target '*.gradle'
		greclipse()
	}

	java {
		importOrder()
		removeUnusedImports()
		eclipse()
		formatAnnotations()
	}
}

publishMods {
	file = jar.archiveFile
	type = STABLE
	modLoaders.add("fabric")
	changelog= "Build with Scala3: ${detected_scala_version}"

	modrinth {
		minecraftVersionRange {
			start = "26.1"
			end = "latest"
			includeSnapshots = true
		}
		projectId = "Ptd0Ha1s"
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
	}

	github {
		repository = "Krysztal112233/krysztal-language-scala"
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
		commitish = "krysztal"
		tagName = version
	}

	// curseforge {
	// 	projectId = "999484"
	// 	accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
	// 	minecraftVersionRange {
	// 		start = "1.17"
	// 		end = "latest"
	// 	}
	// }
}
